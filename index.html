<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hell Work</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#000000">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#000;
  color:#fff;
}

h1{text-align:center;}

.container{padding:15px;}

.page{display:none;}
.active{display:block;}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px;
}

.nav button{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
}

/* CALENDAR */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  margin-top:15px;
}

.day{
  background:#222;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

.day.activeDay{
  background:#00c853;
}

/* INPUT */
input,select{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:none;
  margin:10px 0;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:18px;
}

.green{background:#00c853;}
.blue{background:#2962ff;}
.orange{background:#ff9800;}

</style>
</head>

<body>

<h1>🔥 Hell Work</h1>

<div class="container">

<!-- HOME -->
<div id="home" class="page active">

<select id="month"></select>

<h2>💰 Total: € <span id="total">0</span></h2>

<div id="calendar" class="grid"></div>

<button class="btn blue" onclick="exportPDF()">📄 Exportar PDF</button>

</div>

<!-- ADD -->
<div id="add" class="page">

<input id="local" placeholder="Local">

<label><input type="checkbox" id="kasseien"> Kasseien</label>
<input id="kasseien_m" placeholder="metros">

<label><input type="checkbox" id="platines"> Platines</label>
<input id="platines_m" placeholder="metros">

<label><input type="checkbox" id="mosaic"> Mosaic</label>
<input id="mosaic_m" placeholder="metros">

<label><input type="checkbox" id="juntas"> Juntas</label>
<input id="juntas_m" placeholder="metros">

<label><input type="checkbox" id="day"> Day</label>
<label><input type="checkbox" id="half"> Meio dia</label>

<button class="btn green" onclick="saveDay()">Guardar dia</button>

</div>

<!-- SETTINGS -->
<div id="settings" class="page">

<h2>⚙️ Preços</h2>

<input id="p_k" placeholder="Kasseien">
<input id="p_p" placeholder="Platines">
<input id="p_m" placeholder="Mosaic">
<input id="p_j" placeholder="Juntas">
<input id="p_d" placeholder="Day">
<input id="p_h" placeholder="Meio dia">

<button class="btn orange" onclick="savePrices()">Guardar preços</button>

</div>

</div>

<div class="nav">
<button onclick="showPage('home')">📅</button>
<button onclick="showPage('add')">➕</button>
<button onclick="showPage('settings')">⚙️</button>
</div>

<script>

let selectedDay = 1;

document.addEventListener("DOMContentLoaded", function(){

const months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
months.forEach((m,i)=>{
  let opt=document.createElement("option");
  opt.value=i;
  opt.text=m;
  month.appendChild(opt);
});

month.value=new Date().getMonth();

generateCalendar();
updateTotal();

});

function generateCalendar(){
  calendar.innerHTML="";

  let data = JSON.parse(localStorage.getItem("days")||"{}");

  for(let i=1;i<=31;i++){
    let d=document.createElement("div");
    d.className="day";
    d.innerText=i;

    if(data[i]){
      d.classList.add("activeDay");
    }

    d.onclick=()=>{
      selectedDay=i;
      showPage("add");
    }

    calendar.appendChild(d);
  }
}

function savePrices(){
  let prices={
    k:+p_k.value||0,
    p:+p_p.value||0,
    m:+p_m.value||0,
    j:+p_j.value||0,
    d:+p_d.value||0,
    h:+p_h.value||0
  };
  localStorage.setItem("prices",JSON.stringify(prices));
  alert("Preços guardados");
}

function saveDay(){

let prices=JSON.parse(localStorage.getItem("prices")||"{}");

let total=0;
let desc=[];

if(kasseien.checked){
 total+=kasseien_m.value*prices.k;
 desc.push("Kasseien "+kasseien_m.value+"m");
}

if(platines.checked){
 total+=platines_m.value*prices.p;
 desc.push("Platines "+platines_m.value+"m");
}

if(mosaic.checked){
 total+=mosaic_m.value*prices.m;
 desc.push("Mosaic "+mosaic_m.value+"m");
}

if(juntas.checked){
 total+=juntas_m.value*prices.j;
 desc.push("Juntas "+juntas_m.value+"m");
}

if(day.checked){
 total+=prices.d;
 desc.push("Day");
}

if(half.checked){
 total+=prices.h;
 desc.push("Meio dia");
}

let data=JSON.parse(localStorage.getItem("days")||"{}");

data[selectedDay]={
  local:local.value,
  desc:desc.join(", "),
  total:total
};

localStorage.setItem("days",JSON.stringify(data));

generateCalendar();
updateTotal();

alert("Guardado!");
showPage("home");

}

function updateTotal(){
  let data=JSON.parse(localStorage.getItem("days")||"{}");
  let t=0;

  Object.values(data).forEach(d=>{
    t+=d.total;
  });

  total.innerText=t;
}

function exportPDF(){

let data=JSON.parse(localStorage.getItem("days")||"{}");

let text="RELATÓRIO\n\n";

let total=0;

for(let d in data){
  text+=`Dia ${d} - ${data[d].local}\n`;
  text+=`${data[d].desc}\n`;
  text+=`Total: €${data[d].total}\n\n`;
  total+=data[d].total;
}

text+="TOTAL GERAL = €"+total;

let blob=new Blob([text],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="relatorio.txt";
a.click();
}

function showPage(p){
  document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

</script>

</body>
</html>
