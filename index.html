<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hell Work</title>

<!-- APP -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#000;
  color:#fff;
}

h1{
  text-align:center;
  margin-top:20px;
}

.container{
  padding:15px;
}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111;
  padding:10px;
}

.nav button{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
}

/* PAGE */
.page{display:none;}
.active{display:block;}

/* CALENDAR */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  margin-top:20px;
}

.day{
  background:#222;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

/* INPUT */
input, select{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  font-size:16px;
}

/* BUTTON */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
  margin-top:10px;
}

.green{background:#00c853;}
.blue{background:#2962ff;}
.orange{background:#ff9800;}
</style>
</head>

<body>

<h1>🔥 Hell Work</h1>

<div class="container">

<!-- PAGE 1 -->
<div id="home" class="page active">

<select id="month"></select>

<h2>💰 Total: € <span id="total">0</span></h2>

<div id="calendar" class="grid"></div>

<button class="btn blue" onclick="exportPDF()">📄 Exportar PDF</button>

</div>

<!-- PAGE 2 -->
<div id="add" class="page">

<input id="local" placeholder="Local">

<label><input type="checkbox" id="kasseien"> Kasseien</label>
<input id="kasseien_m" placeholder="metros">

<label><input type="checkbox" id="platines"> Platines</label>
<input id="platines_m" placeholder="metros">

<label><input type="checkbox" id="mosaic"> Mosaic</label>
<input id="mosaic_m" placeholder="metros">

<label><input type="checkbox" id="juntas"> Juntas</label>
<input id="juntas_m" placeholder="metros">

<label><input type="checkbox" id="day"> Day</label>

<label><input type="checkbox" id="half"> Meio dia</label>

<button class="btn green" onclick="saveDay()">+ Adicionar</button>

</div>

<!-- PAGE 3 -->
<div id="settings" class="page">

<h2>⚙️ Preços</h2>

<input id="p_kasseien" placeholder="Kasseien">
<input id="p_platines" placeholder="Platines">
<input id="p_mosaic" placeholder="Mosaic">
<input id="p_juntas" placeholder="Juntas">
<input id="p_day" placeholder="Day">
<input id="p_half" placeholder="Meio dia">

<button class="btn orange" onclick="savePrices()">Guardar preços</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
  <button onclick="showPage('home')">📅</button>
  <button onclick="showPage('add')">➕</button>
  <button onclick="showPage('settings')">⚙️</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const months = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const monthSelect = document.getElementById("month");

months.forEach((m,i)=>{
  let opt = document.createElement("option");
  opt.value=i;
  opt.text=m;
  monthSelect.appendChild(opt);
});

monthSelect.value = new Date().getMonth();

generateCalendar();

});

function generateCalendar(){
  let cal = document.getElementById("calendar");
  cal.innerHTML="";

  for(let i=1;i<=31;i++){
    let d = document.createElement("div");
    d.className="day";
    d.innerText=i;
    cal.appendChild(d);
  }
}

function showPage(p){
  document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
  document.getElementById(p).classList.add("active");
}

function savePrices(){
  let prices={
    k:parseFloat(p_kasseien.value)||0,
    p:parseFloat(p_platines.value)||0,
    m:parseFloat(p_mosaic.value)||0,
    j:parseFloat(p_juntas.value)||0,
    d:parseFloat(p_day.value)||0,
    h:parseFloat(p_half.value)||0
  };
  localStorage.setItem("prices",JSON.stringify(prices));
  alert("Guardado");
}

function saveDay(){
  let prices=JSON.parse(localStorage.getItem("prices")||"{}");

  let total=0;

  if(kasseien.checked) total += (kasseien_m.value||0)*prices.k;
  if(platines.checked) total += (platines_m.value||0)*prices.p;
  if(mosaic.checked) total += (mosaic_m.value||0)*prices.m;
  if(juntas.checked) total += (juntas_m.value||0)*prices.j;
  if(day.checked) total += prices.d;
  if(half.checked) total += prices.h;

  let t = parseFloat(localStorage.getItem("total")||0);
  t += total;
  localStorage.setItem("total",t);

  document.getElementById("total").innerText=t;
  alert("Dia guardado");
}

function exportPDF(){
  let t = localStorage.getItem("total")||0;
  let txt = "TOTAL = € "+t;

  let blob = new Blob([txt], {type:"text/plain"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "trabalho.txt";
  a.click();
}
</script>

</body>
</html>
