<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Hell Work</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#000;
  color:#fff;
}

h1{text-align:center;}

.container{
  padding:15px;
  padding-bottom:100px;
}

.page{display:none;}
.active{display:block;}

/* NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(20,20,20,0.9);
  backdrop-filter: blur(10px);
  padding:20px 0;
}

.nav button{
  background:none;
  border:none;
  color:#888;
  font-size:30px;
}

.nav button.activeNav{
  color:#4da6ff;
}

/* CALENDAR */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day{
  background:#222;
  padding:18px;
  text-align:center;
  border-radius:12px;
}

/* CORES */
.k{background:#00c853;}
.p{background:#2962ff;}
.m{background:#9c27b0;}
.j{background:#ff9800;}
.d{background:#ffc107;}
.h{background:#aaa;}

/* INPUT */
input,select{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:none;
  margin:10px 0;
}

/* BUTTON */
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
}

.green{background:#00c853;}
.blue{background:#2962ff;}
.orange{background:#ff9800;}

</style>
</head>

<body>

<h1>🔥 Hell Work</h1>

<div class="container">

<!-- HOME -->
<div id="home" class="page active">

<select id="month"></select>

<h2>💰 Total: € <span id="total">0</span></h2>

<div id="calendar" class="grid"></div>

<button class="btn blue" onclick="exportPDF()">📄 Exportar PDF</button>

</div>

<!-- ADD -->
<div id="add" class="page">

<input id="local" placeholder="Local">

<label><input type="checkbox" id="k"> Kasseien</label>
<input id="k_m" placeholder="metros">

<label><input type="checkbox" id="p"> Platines</label>
<input id="p_m" placeholder="metros">

<label><input type="checkbox" id="m"> Mosaic</label>
<input id="m_m" placeholder="metros">

<label><input type="checkbox" id="j"> Juntas</label>
<input id="j_m" placeholder="metros">

<label><input type="checkbox" id="d"> Day</label>
<label><input type="checkbox" id="h"> Meio dia</label>

<button class="btn green" onclick="saveDay()">Guardar</button>
<button class="btn orange" onclick="deleteDay()">Apagar</button>

</div>

<!-- SETTINGS -->
<div id="settings" class="page">

<h2>⚙️ Preços</h2>

<input id="pk" placeholder="Kasseien">
<input id="pp" placeholder="Platines">
<input id="pm" placeholder="Mosaic">
<input id="pj" placeholder="Juntas">
<input id="pd" placeholder="Day">
<input id="ph" placeholder="Meio dia">

<button class="btn orange" onclick="savePrices()">Guardar preços</button>

</div>

</div>

<div class="nav">
<button onclick="showPage('home',this)" class="activeNav">📅</button>
<button onclick="showPage('add',this)">➕</button>
<button onclick="showPage('settings',this)">⚙️</button>
</div>

<script>

let selectedDay=1;

document.addEventListener("DOMContentLoaded",()=>{

const months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
months.forEach((m,i)=>{
 let o=document.createElement("option");
 o.value=i;
 o.text=m;
 month.appendChild(o);
});

month.value=new Date().getMonth();

generateCalendar();
updateTotal();

});

/* CALENDAR */
function generateCalendar(){

calendar.innerHTML="";
let data=JSON.parse(localStorage.getItem("days")||"{}");

for(let i=1;i<=31;i++){

 let d=document.createElement("div");
 d.className="day";
 d.innerText=i;

 if(data[i]){
   d.classList.add(data[i].type);
 }

 d.onclick=()=>{
   selectedDay=i;
   showPage("add");
 };

 calendar.appendChild(d);
}

}

/* SAVE PRICES */
function savePrices(){
 let p={
  k:+pk.value||0,
  p:+pp.value||0,
  m:+pm.value||0,
  j:+pj.value||0,
  d:+pd.value||0,
  h:+ph.value||0
 };
 localStorage.setItem("prices",JSON.stringify(p));
 alert("Guardado");
}

/* SAVE DAY */
function saveDay(){

let prices=JSON.parse(localStorage.getItem("prices")||"{}");

let total=0;
let desc=[];
let type="";

if(k.checked){
 total+=k_m.value*prices.k;
 desc.push("Kasseien "+k_m.value+"m");
 type="k";
}

if(p.checked){
 total+=p_m.value*prices.p;
 desc.push("Platines "+p_m.value+"m");
 type="p";
}

if(m.checked){
 total+=m_m.value*prices.m;
 desc.push("Mosaic "+m_m.value+"m");
 type="m";
}

if(j.checked){
 total+=j_m.value*prices.j;
 desc.push("Juntas "+j_m.value+"m");
 type="j";
}

if(d.checked){
 total+=prices.d;
 desc.push("Day");
 type="d";
}

if(h.checked){
 total+=prices.h;
 desc.push("Meio dia");
 type="h";
}

let data=JSON.parse(localStorage.getItem("days")||"{}");

data[selectedDay]={
 local:local.value,
 desc:desc.join(", "),
 total:total,
 type:type
};

localStorage.setItem("days",JSON.stringify(data));

generateCalendar();
updateTotal();

alert("Guardado");
showPage("home");

}

/* DELETE */
function deleteDay(){
 let data=JSON.parse(localStorage.getItem("days")||"{}");
 delete data[selectedDay];
 localStorage.setItem("days",JSON.stringify(data));
 generateCalendar();
 updateTotal();
 alert("Apagado");
}

/* TOTAL */
function updateTotal(){
 let data=JSON.parse(localStorage.getItem("days")||"{}");
 let t=0;
 Object.values(data).forEach(d=>t+=d.total);
 total.innerText=t;
}

/* PDF PRO */
function exportPDF(){

let data=JSON.parse(localStorage.getItem("days")||"{}");

let text="RELATÓRIO\n\n";
let total=0;

for(let d in data){
 text+=`Day ${d} - ${data[d].local}\n`;
 text+=`${data[d].desc}\n`;
 text+=`Total: €${data[d].total}\n\n`;
 total+=data[d].total;
}

text+="TOTAL = €"+total;

let blob=new Blob([text],{type:"text/plain"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="relatorio.txt";
a.click();
}

/* NAV */
function showPage(p,btn){
 document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
 document.getElementById(p).classList.add("active");

 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("activeNav"));
 if(btn) btn.classList.add("activeNav");
}

</script>

</body>
</html>
