<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hell Work</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:-apple-system;
background:#000;
color:#fff;
}

.page{
display:none;
padding:15px;
padding-bottom:100px;
}

.activePage{
display:block;
}

h1{
text-align:center;
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.day{
background:#222;
padding:15px;
border-radius:12px;
text-align:center;
}

.selected{
background:#00bcd4;
}

.filled{
background:#00c853;
}

/* INPUTS */
input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
margin-bottom:10px;
}

label{
display:flex;
align-items:center;
margin:10px 0;
}

label input{
width:auto;
margin-right:10px;
}

select{
width:100%;
padding:10px;
border-radius:12px;
border:none;
margin-bottom:10px;
}

/* BUTTONS */
button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-top:10px;
font-size:16px;
}

.green{background:#00c853;}
.blue{background:#2962ff;}
.orange{background:#ff9800;}

/* NAV */
.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
justify-content:space-around;
padding:10px;
}

.nav div{
font-size:20px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page activePage">
<h1>🔥 Hell Work</h1>

<select id="month"></select>

<h2>💰 Total: € <span id="total">0</span></h2>

<div class="calendar" id="calendar"></div>

<button class="blue" onclick="exportPDF()">📄 Exportar PDF</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
<h1>➕ Adicionar</h1>

<input id="local" placeholder="Local">

<label><input type="checkbox" id="kasseien"> Kasseien</label>
<input id="kasseien_m" placeholder="metros">

<label><input type="checkbox" id="platines"> Platines</label>
<input id="platines_m" placeholder="metros">

<label><input type="checkbox" id="mosaic"> Mosaic</label>
<input id="mosaic_m" placeholder="metros">

<label><input type="checkbox" id="juntas"> Juntas</label>
<input id="juntas_m" placeholder="metros">

<label><input type="checkbox" id="day"> Day</label>
<label><input type="checkbox" id="meio"> Meio dia</label>

<button class="green" onclick="guardar()">Guardar</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
<h1>⚙️ Preços</h1>

<input id="p_kasseien" value="6.5">
<input id="p_platines" value="7.5">
<input id="p_mosaic" value="9">
<input id="p_juntas" value="1">
<input id="p_day" value="220">
<input id="p_meio" value="110">

<button class="orange" onclick="guardarPrecos()">Guardar preços</button>
</div>

<!-- NAV -->
<div class="nav">
<div onclick="goPage(1)">📅</div>
<div onclick="goPage(2)">➕</div>
<div onclick="goPage(3)">⚙️</div>
</div>

<script>

// NAV
function goPage(n){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("activePage"));
document.getElementById("page"+n).classList.add("activePage");
}

// PREÇOS
let precos = JSON.parse(localStorage.getItem("precos")) || {
kasseien:6.5,
platines:7.5,
mosaic:9,
juntas:1,
day:220,
meio:110
};

// MESES
let meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let monthSelect = document.getElementById("month");

meses.forEach((m,i)=>{
let op=document.createElement("option");
op.value=i;
op.textContent=m;
monthSelect.appendChild(op);
});

let currentDay=null;

// CALENDAR
function renderCalendar(){
let cal=document.getElementById("calendar");
cal.innerHTML="";

let data = JSON.parse(localStorage.getItem("workData")) || {};

for(let i=1;i<=31;i++){
let d=document.createElement("div");
d.className="day";
d.innerText=i;

if(data[i]) d.classList.add("filled");

d.onclick=()=>{
currentDay=i;
document.querySelectorAll(".day").forEach(x=>x.classList.remove("selected"));
d.classList.add("selected");
goPage(2);
};

cal.appendChild(d);
}
}

renderCalendar();

// GUARDAR
function guardar(){

if(!currentDay){
alert("Seleciona um dia");
return;
}

let total=0;
let desc=[];

let km=parseFloat(kasseien_m.value)||0;
if(kasseien.checked){ total+=km*precos.kasseien; desc.push(km+"m Kasseien"); }

let pm=parseFloat(platines_m.value)||0;
if(platines.checked){ total+=pm*precos.platines; desc.push(pm+"m Platines"); }

let mm=parseFloat(mosaic_m.value)||0;
if(mosaic.checked){ total+=mm*precos.mosaic; desc.push(mm+"m Mosaic"); }

let jm=parseFloat(juntas_m.value)||0;
if(juntas.checked){ total+=jm*precos.juntas; desc.push(jm+"m Juntas"); }

if(day.checked){ total+=precos.day; desc.push("Day"); }
if(meio.checked){ total+=precos.meio; desc.push("Meio dia"); }

let data = JSON.parse(localStorage.getItem("workData")) || {};

data[currentDay]={
local:local.value,
total,
desc
};

localStorage.setItem("workData",JSON.stringify(data));

updateTotal();
renderCalendar();
goPage(1);
}

// TOTAL
function updateTotal(){
let data = JSON.parse(localStorage.getItem("workData")) || {};
let t=0;
Object.values(data).forEach(d=>t+=d.total);
document.getElementById("total").innerText=t;
}
updateTotal();

// PREÇOS
function guardarPrecos(){
precos={
kasseien:parseFloat(p_kasseien.value),
platines:parseFloat(p_platines.value),
mosaic:parseFloat(p_mosaic.value),
juntas:parseFloat(p_juntas.value),
day:parseFloat(p_day.value),
meio:parseFloat(p_meio.value)
};

localStorage.setItem("precos",JSON.stringify(precos));
alert("Guardado!");
}

// PDF
function exportPDF(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();

let data = JSON.parse(localStorage.getItem("workData")) || {};

let y=10;
let total=0;

Object.keys(data).forEach(dia=>{
let d=data[dia];

doc.text("Dia "+dia+" - "+d.local,10,y);
y+=6;

d.desc.forEach(l=>{
doc.text("- "+l,10,y);
y+=5;
});

doc.text("€"+d.total,10,y);
y+=10;

total+=d.total;
});

doc.text("TOTAL: €"+total,10,y+10);

doc.save("hellwork.pdf");
}

</script>

</body>
</html>
