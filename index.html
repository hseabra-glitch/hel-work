<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hell Work</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:-apple-system;
background:#000;
color:#fff;
}

h1{
text-align:center;
margin:20px 0;
}

.container{
padding:15px;
padding-bottom:100px;
}

/* SELECT */
select{
width:100%;
padding:10px;
border-radius:12px;
border:none;
margin-bottom:10px;
}

/* TOTAL */
.total{
font-size:22px;
margin:10px 0;
}

/* CALENDAR */
.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.day{
background:#222;
padding:15px;
border-radius:12px;
text-align:center;
}

.active{
background:#00bcd4;
}

/* FORM */
input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
margin-bottom:10px;
}

label{
display:flex;
align-items:center;
margin:10px 0;
}

label input{
width:auto;
margin-right:10px;
}

/* BUTTONS */
.btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
font-size:16px;
margin-top:10px;
}

.add{
background:#00c853;
color:#fff;
}

.pdf{
background:#2962ff;
color:#fff;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
display:flex;
justify-content:space-around;
padding:10px;
}
</style>
</head>

<body>

<h1>🔥 Hell Work</h1>

<div class="container">

<select id="month"></select>

<div class="total">💰 Total: € <span id="total">0</span></div>

<div class="calendar" id="calendar"></div>

<hr>

<input id="local" placeholder="Local">

<label><input type="checkbox" id="kasseien"> Kasseien</label>
<input id="kasseien_m" placeholder="metros">

<label><input type="checkbox" id="platines"> Platines</label>
<input id="platines_m" placeholder="metros">

<label><input type="checkbox" id="mosaic"> Mosaic</label>
<input id="mosaic_m" placeholder="metros">

<label><input type="checkbox" id="juntas"> Juntas</label>
<input id="juntas_m" placeholder="metros">

<label><input type="checkbox" id="day"> Day</label>
<label><input type="checkbox" id="meio"> Meio dia</label>

<button class="btn add" onclick="guardar()">+ Adicionar</button>
<button class="btn pdf" onclick="exportPDF()">📄 Exportar PDF</button>

</div>

<div class="nav">
<div>📅</div>
<div>➕</div>
<div>⚙️</div>
</div>

<script>

// PREÇOS
let precos = {
kasseien:6.5,
platines:7.5,
mosaic:9,
juntas:1,
day:220,
meio:110
};

// MESES
let meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

let monthSelect = document.getElementById("month");

meses.forEach((m,i)=>{
let op = document.createElement("option");
op.value=i;
op.textContent=m;
monthSelect.appendChild(op);
});

let currentDay = null;

// CALENDÁRIO
function renderCalendar(){
let cal = document.getElementById("calendar");
cal.innerHTML="";

for(let i=1;i<=31;i++){
let d = document.createElement("div");
d.className="day";
d.innerText=i;

d.onclick=()=>{
currentDay=i;
document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
d.classList.add("active");
};

cal.appendChild(d);
}
}

renderCalendar();

// GUARDAR
function guardar(){

if(!currentDay){
alert("Seleciona um dia");
return;
}

let total = 0;
let desc = [];

let k = document.getElementById("kasseien").checked;
let km = parseFloat(document.getElementById("kasseien_m").value)||0;

if(k){
let val = km * precos.kasseien;
total+=val;
desc.push(km+"m Kasseien");
}

let p = document.getElementById("platines").checked;
let pm = parseFloat(document.getElementById("platines_m").value)||0;

if(p){
let val = pm * precos.platines;
total+=val;
desc.push(pm+"m Platines");
}

let m = document.getElementById("mosaic").checked;
let mm = parseFloat(document.getElementById("mosaic_m").value)||0;

if(m){
let val = mm * precos.mosaic;
total+=val;
desc.push(mm+"m Mosaic");
}

let j = document.getElementById("juntas").checked;
let jm = parseFloat(document.getElementById("juntas_m").value)||0;

if(j){
let val = jm * precos.juntas;
total+=val;
desc.push(jm+"m Juntas");
}

if(document.getElementById("day").checked){
total+=precos.day;
desc.push("Day");
}

if(document.getElementById("meio").checked){
total+=precos.meio;
desc.push("Meio dia");
}

let data = JSON.parse(localStorage.getItem("workData")) || {};

data[currentDay] = {
local:document.getElementById("local").value,
total:total,
desc:desc.join("\n")
};

localStorage.setItem("workData",JSON.stringify(data));

updateTotal();

alert("Guardado!");
}

// TOTAL
function updateTotal(){
let data = JSON.parse(localStorage.getItem("workData")) || {};
let t=0;

Object.values(data).forEach(d=>{
t+=d.total;
});

document.getElementById("total").innerText = t;
}

updateTotal();

// PDF
function exportPDF(){

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let data = JSON.parse(localStorage.getItem("workData")) || {};

let y = 15;

doc.setFontSize(18);
doc.text("HELL WORK", 10, y);

y+=10;
doc.setFontSize(12);
doc.text("Relatório Mensal", 10, y);

y+=10;

let totalGeral=0;

Object.keys(data).sort((a,b)=>a-b).forEach(dia=>{

let d = data[dia];

doc.setFontSize(13);
doc.text("Dia "+dia,10,y);

y+=6;
doc.setFontSize(11);
doc.text("Local: "+(d.local||"-"),10,y);

y+=6;

d.desc.split("\n").forEach(l=>{
doc.text("• "+l,10,y);
y+=5;
});

doc.text("Total: €"+d.total,10,y);

y+=8;
totalGeral+=d.total;

if(y>270){
doc.addPage();
y=20;
}

});

y+=10;
doc.setFontSize(14);
doc.text("TOTAL: €"+totalGeral,10,y);

doc.save("hellwork.pdf");
}

</script>

</body>
</html>
